<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ring-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg1)"/>

  <!-- Кольцо с неоновым свечением -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="28"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring-grad1)" stroke-width="28"
          stroke-dasharray="1005" stroke-dashoffset="260" stroke-linecap="round"
          transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- Объёмная книга -->
  <g filter="url(#shadow)">
    <path d="M150 210 C200 190, 240 210, 256 220 V330 C240 320, 200 300, 150 320 Z" fill="#f8fafc" opacity="0.95"/>
    <path d="M362 210 C312 190, 272 210, 256 220 V330 C272 320, 312 300, 362 320 Z" fill="#cbd5e1"/>
    <path d="M256 220 L256 330" stroke="#0f172a" stroke-width="6" opacity="0.3"/>
  </g>
</svg>
